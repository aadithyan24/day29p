<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            /* width: 1000px; */
            height: 1000px;
            margin: 50px;
            background-size: contain;
            text-align: center;
            background-size: cover;
            background-color: black;
            background-image: url(./image.png);
            background-repeat: no-repeat;

        }

        .card {
            /* width: 500px;
            height: 250px; */
            color: white;
            margin: 8px;
            padding: 20px;
            background-image: linear-gradient(70deg, rgb(201, 12, 164)0%, rgb(115, 80, 197));
            border-radius: 15px;
            border-style: solid;
            border-width: 4px;
            box-sizing: 20px;
            display: inline-block;
        }
        /* button{
            z-index: 1;
        } */
        .reset{
            z-index: 1;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>GUESS THE NUMBER</h1>
        <p>we have selected a random number between 1 and 10. can you guess it?</p>

        <input type="tel" id="number" placeholder="00">

        <button onclick="check()">check</button>

        <h3>Attempts:<span id="attempt">5</span></h3>
        <h2 id="result"></h2>
        <p id="hint"></p>
        <button onclick="reset()" class="reset">play again</button>
    </div>

    <script>
        let num = Math.floor(Math.random() * 10) + 1
        console.log(num)
        let attempt = 5
        function check() {
            let usernumber = Number(document.getElementById("number").value)

            if (attempt <= 1) {
                alert("game over you lose")
                alert("restating the game....!")
                window.location.reload()
            }
            if (num == usernumber) {
                document.getElementById("result").innerHTML = "🎉 YOU WON THE GAME 🥳"
                document.getElementById("hint").innerHTML = ""


                // alert("you won the game")
                // alert("restarting the game")
                // window.location.reload()
            }
            else {
                document.getElementById("result").innerHTML = "wrong"
                attempt--;
                document.getElementById("attempt").innerHTML = attempt
                if (usernumber > num) {
                    document.getElementById("hint").innerHTML = "Hint:number was high"
                }
                else {
                    document.getElementById("hint").innerHTML = "Hint:number was low"
                }
            }
        }
        function reset(){
             window.location.reload()
        }
    </script>

</body>

</html>
